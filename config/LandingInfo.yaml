# Landing success criteria.
landing_info:
  required_frames: 10
  distance_threshold: 0.03
  drone_distance_threshold: 0.10
  angle_threshold_rad: 0.05
  alignment_timeout_s: 60.0

# Ground-robot AprilTag alignment controller.
move_parameter: 1.5
rotate_parameter: 0.5
smooth_alpha: 0.5
close_distance_threshold: 0.5
stop_distance_threshold: 0.02
fast_move_param: 1.15
normal_move_param: 1.0
max_linear_vel: 0.25
max_angular_vel: 0.30
min_linear_vel: 0.025
min_angular_vel: 0.05
